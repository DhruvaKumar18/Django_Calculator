<!DOCTYPE html>
<html>
<head>
    <title>Django Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            margin-top:100px;
        }

        .container{
            width:350px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input,select,button{
            width:90%;
            padding:10px;
            margin:10px;
            font-size:18px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        h2{
            color:green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Simple Calculator</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="number"
            step="any"
            name="num1"
            placeholder="Enter First Number"
            required
        >

        <select name="operation">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>

        <input
            type="number"
            step="any"
            name="num2"
            placeholder="Enter Second Number"
            required
        >

        <button type="submit">
            Calculate
        </button>

    </form>

    <h2>
        Result : {{ result }}
    </h2>

</div>

</body>
</html>
